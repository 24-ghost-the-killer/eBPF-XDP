# ClickHouse for xdp-sentinel flow/window storage (docs/storage.md).
# Localhost only. Schema: schema.sql (applied with clickhouse-client).
#
#   echo "CLICKHOUSE_PASSWORD=$(openssl rand -base64 18)" > .env
#   docker compose up -d
#   docker compose exec -T clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" --multiquery < schema.sql
name: xdp-sentinel-clickhouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: xs
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"   # HTTP
      - "127.0.0.1:9000:9000"   # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse

volumes:
  clickhouse-data:
