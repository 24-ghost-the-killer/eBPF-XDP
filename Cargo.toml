[workspace]
resolver = "2"
# Phase 1 crates. collector / feature-engine / policy-engine / inference /
# agent join the workspace in their phases (see docs/development.md).
members = ["userspace/common", "userspace/ctl", "userspace/agent", "userspace/inference"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Ghost_the_killer/xdp-sentinel"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
libbpf-rs = "0.27"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
xs-common = { path = "userspace/common" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
