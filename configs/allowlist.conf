# xdp-sentinel operator allowlist, applied by xs-baseline on every boot.
# Installed to /etc/xdp-sentinel/allowlist.conf.
#
#   <cidr> [full|dynamic-exempt]
#
# dynamic-exempt: never blocked, rate limited or capped by auto-mitigation,
# still validity-checked. full: bypasses every check (use sparingly).
192.168.1.0/24          dynamic-exempt   # LAN (admin SSH, Grafana)
fe80::/10               dynamic-exempt   # IPv6 link-local (router RAs, ND)
2001:6c8:ff15:2633::/64 dynamic-exempt   # LAN IPv6 prefix from the router (update if the ISP changes it)
